  <style>
    @font-face {
      font-family: Inter;
      src: url("assets/InterVariable.woff2") format("woff2");
      font-weight: 100 900;
      font-display: swap;
    }

    :root {
      --yellow: #f0b90b;
      --ink: #0b0e11;
      --white: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #000;
      color: var(--white);
      font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif;
      font-optical-sizing: auto;
      overflow: hidden;
    }

    .stage {
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
    }

    .slide {
      display: none;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      background: var(--ink);
      position: relative;
      padding: 6% 7%;
    }
    .slide.on { display: flex; flex-direction: column; }

    .slide.title-slide {
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8%;
    }

    .logo-h {
      height: 36px;
      width: auto;
      display: block;
    }
    .logo-v {
      height: 88px;
      width: auto;
      display: block;
    }

    .kicker {
      font-size: clamp(14px, 1.35vw, 22px);
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--yellow);
      margin-bottom: 1.2vh;
    }

    h1 {
      font-size: clamp(36px, 4.6vw, 84px);
      font-weight: 600;
      line-height: 1.08;
      letter-spacing: -0.03em;
    }

    .lede {
      margin-top: 2.4vh;
      font-size: clamp(20px, 2.15vw, 40px);
      font-weight: 400;
      line-height: 1.25;
      color: rgba(255,255,255,0.86);
      max-width: 18ch;
    }

    .lede.wide { max-width: 28ch; }

    .foot {
      position: absolute;
      left: 7%;
      right: 7%;
      bottom: 4.5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .foot .meta {
      font-size: clamp(12px, 1.05vw, 18px);
      color: rgba(255,255,255,0.45);
      font-weight: 500;
    }
    .num {
      font-variant-numeric: tabular-nums;
      color: rgba(255,255,255,0.45);
      font-size: clamp(12px, 1.05vw, 18px);
    }

    .stack { display: flex; flex-direction: column; gap: 2.2vh; flex: 1; justify-content: center; }
    .row { display: flex; gap: 2.4vw; align-items: stretch; }
    .grow { flex: 1; }

    .item {
      font-size: clamp(26px, 2.8vw, 52px);
      font-weight: 550;
      line-height: 1.15;
    }
    .item small {
      display: block;
      margin-top: 0.6vh;
      font-size: 0.42em;
      font-weight: 400;
      color: rgba(255,255,255,0.55);
    }

    .rule {
      width: 48px;
      height: 3px;
      background: var(--yellow);
      margin: 0 0 2vh;
    }

    .big {
      font-size: clamp(56px, 8vw, 140px);
      font-weight: 650;
      letter-spacing: -0.04em;
      line-height: 0.95;
      color: var(--yellow);
    }
    .n {
      font-size: clamp(28px, 3.2vw, 56px);
      font-weight: 650;
      letter-spacing: -0.04em;
      color: var(--yellow);
      font-variant-numeric: tabular-nums;
      margin-bottom: 1.6vh;
    }

    .cols {
      display: grid;
      gap: 3vw;
      align-items: start;
    }
    .cols.c2 { grid-template-columns: 1fr 1fr; }
    .cols.c3 { grid-template-columns: 1fr 1fr 1fr; }
    .cols.c4 { grid-template-columns: 1fr 1fr 1fr 1fr; }

    .col h2 {
      font-size: clamp(14px, 1.3vw, 22px);
      font-weight: 600;
      color: var(--yellow);
      margin-bottom: 1.4vh;
    }
    .col p, .col li {
      font-size: clamp(18px, 1.7vw, 32px);
      font-weight: 500;
      line-height: 1.3;
      color: var(--white);
    }
    .col li {
      list-style: none;
      margin: 0.9vh 0;
      display: flex;
      align-items: center;
      gap: 0.7em;
    }
    .tool {
      height: 1.15em;
      width: 1.15em;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .steps {
      display: flex;
      flex-direction: column;
      gap: 2.4vh;
    }
    .step {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 1.8vw;
      align-items: center;
    }
    .step .n { margin-bottom: 0; }
    .step .cmd { margin-top: 0; }
    .step .why {
      margin-top: 0.7vh;
      font-size: clamp(16px, 1.45vw, 26px);
      font-weight: 400;
      color: rgba(255,255,255,0.55);
      line-height: 1.25;
    }
    .cmd {
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: clamp(16px, 1.55vw, 28px);
      font-weight: 500;
      color: var(--white);
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 1.2vh 1.4vw;
      margin-top: 1.2vh;
    }

    .qr {
      width: min(32vh, 28vw);
      height: min(32vh, 28vw);
      background: var(--white);
      padding: 12px;
    }
    .qr.sm {
      width: min(26vh, 22vw);
      height: min(26vh, 22vw);
    }
    .qr img { width: 100%; height: 100%; display: block; }
    .qr-caption {
      margin-top: 1.6vh;
      font-size: clamp(16px, 1.5vw, 28px);
      color: rgba(255,255,255,0.75);
      font-weight: 500;
    }
    .qr-row {
      display: flex;
      justify-content: center;
      gap: 4.5vw;
      margin-top: 3vh;
    }
    .qr-row > div { text-align: center; }

    .mark {
      height: 36px;
      width: auto;
      max-width: 180px;
      object-fit: contain;
      display: block;
      margin-bottom: 1.6vh;
    }
    .mark.sq {
      height: 52px;
      width: 52px;
    }
    .mark.lg {
      height: 64px;
      max-width: 280px;
    }
    .photo {
      width: 100%;
      max-height: 42vh;
      object-fit: cover;
      display: block;
    }
    .split {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 4vw;
      align-items: center;
      flex: 1;
    }
    .trust {
      display: flex;
      flex-wrap: wrap;
      gap: 2.6vh 2.8vw;
      align-items: center;
    }
    .trust img {
      height: 26px;
      width: auto;
      max-width: 130px;
      object-fit: contain;
    }

    .ph {
      min-height: 28vh;
      border: 1px solid rgba(255,255,255,0.22);
      display: grid;
      place-items: center;
      color: rgba(255,255,255,0.4);
      font-size: clamp(16px, 1.5vw, 26px);
      text-align: center;
      padding: 3vh;
    }

    .ally-lockup {
      display: flex;
      align-items: center;
      gap: 1.2vw;
      margin-bottom: 1.4vh;
    }
    .ally-lockup .iso {
      height: min(10vh, 88px);
      width: auto;
    }
    .ally-lockup .word {
      height: min(8.5vh, 70px);
      width: auto;
      max-width: 42vw;
    }
    .ally-sq {
      height: min(22vh, 200px);
      width: min(22vh, 200px);
      object-fit: contain;
      display: block;
      margin-bottom: 1.2vh;
    }

    .notes {
      display: none;
      position: fixed;
      left: 0; right: 0; bottom: 0;
      background: #111;
      color: #ddd;
      padding: 12px 20px 16px;
      font-size: 15px;
      line-height: 1.4;
      z-index: 5;
      border-top: 1px solid #333;
    }
    body.notes-on .notes { display: block; }
    body.notes-on .slide { height: calc(min(100vh, calc(100vw * 9 / 16)) - 72px); }

    .help {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.72);
      color: #fff;
      z-index: 6;
      place-items: center;
      font-size: 18px;
      line-height: 1.7;
      text-align: left;
    }
    body.help-on .help { display: grid; }

    @media print {
      html, body { overflow: visible; background: #000; }
      .stage { display: block; }
      .slide {
        display: flex !important;
        page-break-after: always;
        width: 100%;
        height: 100vh;
      }
      .notes, .help { display: none !important; }
    }
  </style>
</head>

    const stage = document.getElementById("stage");
    const notesEl = document.getElementById("notes");
    slides.forEach((s) => {
      const wrap = document.createElement("div");
      wrap.innerHTML = s.html.trim();
      stage.appendChild(wrap.firstElementChild);
    });

    let i = 0;
    const nodes = [...stage.querySelectorAll(".slide")];

    function show(n) {
      i = Math.max(0, Math.min(nodes.length - 1, n));
      nodes.forEach((el, idx) => {
        el.classList.toggle("on", idx === i);
        const num = el.querySelector(".num");
        if (num) {
          const a = String(idx + 1).padStart(2, "0");
          const b = String(nodes.length).padStart(2, "0");
          num.textContent = a + " / " + b;
        }
      });
      notesEl.textContent = slides[i].notes;
      location.hash = String(i + 1);
    }

    function parseHash() {
      const n = parseInt(location.hash.replace("#", ""), 10);
      show(Number.isFinite(n) ? n - 1 : 0);
    }

    window.addEventListener("hashchange", parseHash);
    parseHash();

    document.addEventListener("keydown", (e) => {
      if (["INPUT", "TEXTAREA"].includes(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
        e.preventDefault(); show(i + 1);
      } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
        e.preventDefault(); show(i - 1);
      } else if (e.key === "Home") show(0);
      else if (e.key === "End") show(nodes.length - 1);
      else if (e.key === "s" || e.key === "S") document.body.classList.toggle("notes-on");
      else if (e.key === "f" || e.key === "F") {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
      } else if (e.key === "h" || e.key === "H" || e.key === "?") {
        document.body.classList.toggle("help-on");
      } else if (e.key === "Escape") document.body.classList.remove("help-on");
    });
  </script>
